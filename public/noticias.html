<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noticias y participaciones · Bee Green</title>
<meta name="description" content="Noticias, talleres y participaciones de Bee Green.">
<link rel="icon" href="/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/common.js" defer></script>
<script src="/js/cards.js" defer></script>
</head>
<body>
<main>
<section class="page-head" data-bees="10"><div class="container" style="position:relative;z-index:1"><span class="eyebrow">La colmena cuenta</span><h1>Noticias y participaciones</h1><p class="lead" style="margin-inline:auto">Talleres, ferias, escuelas y novedades de la comunidad.</p></div></section>
<section class="section" style="padding-top:10px"><div class="container center">
  <div class="tabs" id="tabs"><button data-t="" class="active">Todo</button><button data-t="noticia">Noticias</button><button data-t="participacion">Participaciones</button></div>
  <div class="grid grid-3" id="grid" style="text-align:left"></div>
</div></section>
</main>
<script>
document.addEventListener('DOMContentLoaded', async () => {
const posts = await BG.api('/api/posts').catch(() => []);
let t = new URLSearchParams(location.search).get('tipo') || '';
function render() {
  tabs.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.t === t));
  grid.innerHTML = posts.filter((p) => !t || p.type === t).map(postCard).join('') || '<p class="muted">Aún no hay publicaciones aquí.</p>';
}
tabs.querySelectorAll('button').forEach((b) => b.onclick = () => { t = b.dataset.t; render(); });
render();
});
</script>
</body>
</html>
